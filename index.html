<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venice Image Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #17171a;
      --surface2: #1f1f24;
      --border: #2e2e36;
      --accent: #7c3aed;
      --accent-h: #6d28d9;
      --text: #ececec;
      --muted: #777;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.1);
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding-bottom: 8px;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input[type="password"],
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input[type="password"]:focus,
    textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 96px;
      line-height: 1.5;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .dropzone:hover,
    .dropzone.over {
      border-color: var(--accent);
      background: rgba(124,58,237,0.06);
    }
    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .dropzone-icon { font-size: 2rem; margin-bottom: 10px; }
    .dropzone-main { font-size: 0.9rem; }
    .dropzone-sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    /* Image preview */
    .preview-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
    }
    .preview-wrap img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }
    .preview-clear {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.65);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
      backdrop-filter: blur(4px);
    }
    .preview-info {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 4px 2px 0;
      line-height: 1;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
      text-align: center;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-row .btn { flex: 1; }

    /* Error */
    .error {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 9px;
      padding: 11px 14px;
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    /* Loading */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 18px;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* Result image */
    #result-img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Venice Image Editor</h1>
    <p>grok-imagine-edit via Venice AI</p>
  </header>

  <!-- ===== Input View ===== -->
  <div id="view-input">
    <div style="display:flex;flex-direction:column;gap:14px;">

      <!-- API Key -->
      <div class="card">
        <div class="label">Venice API Key</div>
        <input type="password" id="api-key" placeholder="xxxxxxxx..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Image Upload -->
      <div class="card">
        <div class="label">元画像</div>

        <div id="dropzone" class="dropzone">
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
          <div class="dropzone-icon">🖼️</div>
          <div class="dropzone-main">画像をドロップ、またはタップして選択</div>
          <div class="dropzone-sub">JPG / PNG / WebP（2MB超は自動リサイズ）</div>
        </div>

        <div id="preview-area" hidden>
          <div class="preview-wrap">
            <img id="preview-img" src="" alt="preview">
            <button class="preview-clear" onclick="clearImage()" title="削除">✕</button>
          </div>
          <div class="preview-info" id="preview-info"></div>
        </div>
      </div>

      <!-- Prompt -->
      <div class="card">
        <div class="label">プロンプト</div>
        <textarea id="prompt" placeholder="例: Make the background a snowy mountain landscape"></textarea>
      </div>

      <!-- Error -->
      <div id="error-box" class="error" hidden></div>

      <!-- Send -->
      <button class="btn btn-primary" id="send-btn" onclick="handleSend()">編集を送信</button>
    </div>
  </div>

  <!-- ===== Loading View ===== -->
  <div id="view-loading" hidden>
    <div class="spinner"></div>
    <div class="loading-text">Venice API に送信中...</div>
  </div>

  <!-- ===== Result View ===== -->
  <div id="view-result" hidden>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card">
        <img id="result-img" src="" alt="result">
      </div>
      <button class="btn btn-primary" onclick="saveResult()">保存 / 共有</button>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goNewImage()">別の画像を編集</button>
        <button class="btn btn-secondary" onclick="goSameImage()">同じ画像を編集</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ---------- In-memory state ----------
  const S = {
    apiKey: '',
    imageB64: '',
    imageMime: '',
    imagePreviewUrl: '',
    imageFilename: '',
    prompt: '',
    resultBlobUrl: '',
    resultFilename: 'venice_edit.jpg',
  };

  const TARGET_BYTES = 2 * 1024 * 1024;

  // ---------- View ----------
  function showView(id) {
    ['view-input', 'view-loading', 'view-result'].forEach(v => {
      document.getElementById(v).hidden = (v !== id);
    });
  }

  // ---------- File handling ----------
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });

  function clearImage() {
    S.imageB64 = ''; S.imageMime = ''; S.imagePreviewUrl = ''; S.imageFilename = '';
    document.getElementById('preview-area').hidden = true;
    document.getElementById('dropzone').hidden = false;
    fileInput.value = '';
  }

  async function processFile(file) {
    const ok = ['image/jpeg', 'image/png', 'image/webp'];
    if (!ok.includes(file.type)) { showError('JPG・PNG・WebP の画像を選択してください'); return; }
    try {
      const { b64, mime } = await toResizedB64(file);
      S.imageB64 = b64;
      S.imageMime = mime;
      S.imageFilename = file.name;
      S.imagePreviewUrl = URL.createObjectURL(file);
      restoreImagePreview(S.imagePreviewUrl, file.name);
      hideError();
    } catch (e) {
      showError('画像の読み込みに失敗: ' + e.message);
    }
  }

  function restoreImagePreview(url, filename) {
    document.getElementById('preview-img').src = url;
    document.getElementById('preview-info').textContent = filename || '';
    document.getElementById('preview-area').hidden = false;
    document.getElementById('dropzone').hidden = true;
  }

  async function toResizedB64(file) {
    const mime = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
    if (file.size <= TARGET_BYTES) {
      return { b64: await readAsB64(file), mime: file.type };
    }
    // Resize via canvas
    const bitmap = await createImageBitmap(file);
    const scale = Math.sqrt(TARGET_BYTES / file.size);
    const canvas = document.createElement('canvas');
    canvas.width  = Math.max(1, Math.floor(bitmap.width  * scale));
    canvas.height = Math.max(1, Math.floor(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);

    let quality = 0.85;
    let blob;
    do {
      blob = await new Promise(res => canvas.toBlob(res, mime, quality));
      quality = Math.max(0.2, quality - 0.1);
    } while (blob.size > TARGET_BYTES && quality > 0.2);

    return { b64: await readAsB64(blob), mime };
  }

  function readAsB64(fileOrBlob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(fileOrBlob);
    });
  }

  // ---------- Send ----------
  async function handleSend() {
    const apiKey = document.getElementById('api-key').value.trim();
    const prompt  = document.getElementById('prompt').value.trim();

    if (!apiKey)        { showError('APIキーを入力してください'); return; }
    if (!S.imageB64)    { showError('画像を選択してください'); return; }
    if (!prompt)        { showError('プロンプトを入力してください'); return; }

    S.apiKey = apiKey;
    S.prompt = prompt;
    hideError();
    showView('view-loading');

    try {
      const blob = await callVenice(apiKey, S.imageB64, S.imageMime, prompt);
      if (S.resultBlobUrl) URL.revokeObjectURL(S.resultBlobUrl);
      S.resultBlobUrl = URL.createObjectURL(blob);
      const _ext = blob.type === 'image/png' ? '.png' : blob.type === 'image/webp' ? '.webp' : '.jpg';
      const _stem = S.imageFilename ? S.imageFilename.replace(/\.[^.]+$/, '') : 'image';
      S.resultFilename = _stem + 'venice_edit' + _ext;
      document.getElementById('result-img').src = S.resultBlobUrl;
      showView('view-result');
    } catch (e) {
      showView('view-input');
      showError(fmtError(e.message));
    }
  }

  async function callVenice(apiKey, imageB64, mime, prompt) {
    const res = await fetch('https://api.venice.ai/api/v1/image/edit', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'grok-imagine-edit',
        prompt: prompt,
        image: 'data:' + mime + ';base64,' + imageB64,
        safe_mode: false,
      }),
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(res.status + '|' + txt);
    }
    return await res.blob();
  }

  function fmtError(msg) {
    if (msg.startsWith('401|'))  return 'APIキーが無効です。キーを確認してください。';
    if (msg.startsWith('429|'))  return 'レート制限中です。少し待ってから再試行してください。';
    if (msg.startsWith('400|') || msg.startsWith('451|'))
      return 'リクエストが拒否されました（モデレーション）。プロンプトや画像を変えてみてください。';
    if (msg.startsWith('5'))     return 'Venice側でエラーが発生しました。しばらく後に再試行してください。';
    if (/fetch|NetworkError|CORS/i.test(msg))
      return 'ネットワークエラー。VeniceのAPIがブラウザからのアクセスをブロックしている可能性があります（CORS）。';
    return 'エラー: ' + msg;
  }

  // ---------- Result actions ----------
  async function saveResult() {
    if (navigator.canShare) {
      try {
        const res = await fetch(S.resultBlobUrl);
        const blob = await res.blob();
        const file = new File([blob], S.resultFilename, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e.name === 'AbortError') return; // ユーザーがキャンセル
        // 非対応の場合はフォールバック
      }
    }
    const a = document.createElement('a');
    a.href = S.resultBlobUrl;
    a.download = S.resultFilename;
    a.click();
  }

  function goNewImage() {
    clearImage();
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  function goSameImage() {
    restoreImagePreview(S.imagePreviewUrl, S.imageFilename);
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  // ---------- Helpers ----------
  function showError(msg) {
    const b = document.getElementById('error-box');
    b.textContent = msg;
    b.hidden = false;
  }
  function hideError() {
    document.getElementById('error-box').hidden = true;
  }
</script>
</body>
</html>
