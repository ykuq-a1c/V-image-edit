<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V tools via API</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPGJSV7MNR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZPGJSV7MNR');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #17171a;
      --surface2: #1f1f24;
      --border: #2e2e36;
      --accent: #7c3aed;
      --accent-h: #6d28d9;
      --text: #ececec;
      --muted: #777;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.1);
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding-bottom: 8px;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .quality-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .quality-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .quality-btn {
      padding: 5px 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .quality-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .credit-info {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .aspect-row {
      display: flex;
      align-items: center;
    }

    .history-header {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .gallery-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      border: 2px solid transparent;
      transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .gallery-thumb:hover {
      border-color: var(--accent);
    }
    .gallery-item-wrap {
      position: relative;
    }
    .gallery-placeholder {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      background: var(--surface2);
      display: block;
      cursor: default;
    }
    .gallery-thumb-pending {
      opacity: 0.35;
      cursor: default;
    }
    .gallery-generating-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .i2v-queue-header {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sel-toggle-btn {
      padding: 5px 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
      line-height: 1.4;
    }
    .sel-toggle-btn:hover { background: var(--surface2); color: var(--text); }

    .sel-count {
      color: var(--accent);
      margin-left: 6px;
    }

    .sel-action-bar {
      display: flex;
      gap: 8px;
      padding: 0 0 8px;
    }
    .sel-action-btn {
      flex: 1;
      padding: 9px 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .sel-action-btn:disabled { opacity: 0.3; cursor: default; }
    .sel-action-btn:not(:disabled):active { background: var(--border); }
    .sel-delete-btn.confirm {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .sel-check {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      z-index: 2;
      pointer-events: none;
    }
    .gallery-item-wrap.selected .sel-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .gallery-item-wrap.selected .sel-check::after { content: '✓'; }
    .gallery-item-wrap.selectable { cursor: pointer; }
    .gallery-item-wrap.selected .gallery-thumb {
      outline: 2.5px solid var(--accent);
      outline-offset: -2px;
    }

    .i2v-sel-check {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      background: var(--surface);
      color: transparent;
    }
    .i2v-queue-item.selected .i2v-sel-check {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .i2v-queue-item.selected {
      border-color: var(--accent);
      background: rgba(124,58,237,0.1);
    }
    .i2v-queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .i2v-thumb {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .i2v-info {
      flex: 1;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .i2v-status-pending {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .i2v-status-done {
      font-size: 0.8rem;
      color: var(--accent);
      white-space: nowrap;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      text-decoration: underline;
      -webkit-tap-highlight-color: transparent;
    }
    .i2v-status-failed {
      font-size: 0.8rem;
      color: var(--danger);
      white-space: nowrap;
    }
    .aspect-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 5px 10px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .aspect-select:focus {
      border-color: var(--accent);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input[type="password"],
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input[type="password"]:focus,
    textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 96px;
      line-height: 1.5;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .dropzone:hover,
    .dropzone.over {
      border-color: var(--accent);
      background: rgba(124,58,237,0.06);
    }
    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .dropzone-icon { font-size: 2rem; margin-bottom: 10px; }
    .dropzone-main { font-size: 0.9rem; }
    .dropzone-sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    /* Image preview */
    .preview-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
    }
    .preview-wrap img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }
    .preview-clear {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.65);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
      backdrop-filter: blur(4px);
    }
    .preview-info {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 4px 2px 0;
      line-height: 1;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
      text-align: center;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary.btn-confirm { background: #0ea5e9; }
    .btn-primary.btn-confirm:hover { background: #0284c7; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-row .btn { flex: 1; }

    /* Prompt display */
    .result-prompt-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .result-prompt-text {
      flex: 1;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
      word-break: break-all;
      font-family: 'Menlo', 'Consolas', monospace;
    }
    .result-prompt-copy {
      flex-shrink: 0;
      padding: 3px 9px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .result-prompt-copy:hover { background: var(--border); color: var(--text); }

    /* Error */
    .error {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 9px;
      padding: 11px 14px;
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    /* Loading */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 18px;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* Result image */
    #result-img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

[hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>V tools via API</h1>
  </header>

  <!-- ===== Input View ===== -->
  <div id="view-input">
    <div style="display:flex;flex-direction:column;gap:14px;">

      <!-- Mode Toggle -->
      <div class="quality-row">
        <div class="quality-toggle">
          <button type="button" class="quality-btn" id="mode-t2i" onclick="setMode('t2i')">T2I</button>
          <button type="button" class="quality-btn active" id="mode-i2i" onclick="setMode('i2i')">I2I</button>
          <button type="button" class="quality-btn" id="mode-i2v" onclick="setMode('i2v')">I2V</button>
        </div>
      </div>

      <!-- API Key -->
      <div class="card">
        <div class="label">V API Key</div>
        <input type="password" id="api-key" placeholder="xxxxxxxx..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Image Upload -->
      <div class="card" id="image-card">
        <div class="label">元画像</div>

        <div id="dropzone" class="dropzone">
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
          <div class="dropzone-icon">🖼️</div>
          <div class="dropzone-main">画像をドロップ、またはタップして選択</div>
          <div class="dropzone-sub">JPG / PNG / WebP（大きい画像は自動リサイズ）</div>
        </div>

        <div id="preview-area" hidden>
          <div class="preview-wrap">
            <img id="preview-img" src="" alt="preview">
            <button class="preview-clear" onclick="clearImage()" title="削除">✕</button>
          </div>
          <div class="preview-info" id="preview-info"></div>
        </div>
      </div>

      <!-- Prompt -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="label">プロンプト</div>
          <button class="sel-toggle-btn" onclick="clearPrompt()">クリア</button>
        </div>
        <textarea id="prompt" placeholder="例: Make the background a snowy mountain landscape"></textarea>
      </div>

      <!-- Model + Quality (T2I / I2I) -->
      <div class="quality-row" id="quality-row-main">
        <div class="quality-toggle">
          <button type="button" class="quality-btn active" id="m-grok" onclick="setModel(MODE_MODELS[selectedMode]?.grok||'grok-imagine-edit')">Grok</button>
          <button type="button" class="quality-btn" id="m-hq" onclick="setModel(MODE_MODELS[selectedMode]?.hq||'grok-imagine-quality-edit')">GHQ</button>
        </div>
        <div class="quality-toggle">
          <button type="button" class="quality-btn active" id="q-1k" onclick="setQuality('1K')">1K</button>
          <button type="button" class="quality-btn" id="q-2k" onclick="setQuality('2K')">2K</button>
        </div>
        <div id="credit-info" class="credit-info">1枚 = 4クレジット消費</div>
      </div>

      <!-- I2V Controls -->
      <div class="quality-row" id="i2v-row" hidden>
        <div class="quality-toggle">
          <button type="button" class="quality-btn active" id="v-grok" onclick="setI2VModel('grok')">Grok</button>
          <button type="button" class="quality-btn" id="v-grok15" onclick="setI2VModel('grok15')">Grok 1.5</button>
        </div>
        <div class="quality-toggle">
          <button type="button" class="quality-btn active" id="v-480p" onclick="setI2VResolution('480p')">480p</button>
          <button type="button" class="quality-btn" id="v-720p" onclick="setI2VResolution('720p')">720p</button>
        </div>
        <select class="aspect-select" id="i2v-duration" onchange="updateI2VCreditInfo()">
          <option value="5s">5s</option>
          <option value="10s">10s</option>
          <option value="15s">15s</option>
        </select>
        <div id="i2v-credit-info" class="credit-info">32クレジット消費</div>
      </div>

      <!-- Aspect Ratio (T2I only) -->
      <div class="aspect-row" id="aspect-row" hidden>
        <select class="aspect-select" id="aspect-select">
          <option value="1:1">Square (1:1)</option>
          <option value="16:9">Cinema (16:9)</option>
          <option value="9:16">Tall (9:16)</option>
          <option value="3:4">Instagram (3:4)</option>
          <option value="3:2">Landscape (3:2)</option>
          <option value="2:3">Portrait (2:3)</option>
        </select>
      </div>

      <!-- Error -->
      <div id="error-box" class="error" hidden></div>

      <!-- Send -->
      <button class="btn btn-primary" id="send-btn" onclick="handleSendClick()">送信</button>

      <!-- History -->
      <div id="history-section" hidden>
        <div class="history-header">
          <span>キューと履歴<span id="hist-sel-count" class="sel-count"></span></span>
          <button class="sel-toggle-btn" id="hist-toggle-btn" onclick="toggleSelectionMode()">選択</button>
        </div>
        <div id="hist-action-bar" class="sel-action-bar" hidden>
          <button class="sel-action-btn" id="hist-all-btn" onclick="toggleSelectAll()">全選択 ☑</button>
          <button class="sel-action-btn" id="hist-save-btn" onclick="saveSelected()" disabled>保存 📥</button>
          <button class="sel-action-btn sel-delete-btn" id="hist-del-btn" onclick="handleDeleteSelected()" disabled>削除 ✘</button>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>

      <!-- I2V Queue -->
      <div id="i2v-queue-section" hidden>
        <div class="i2v-queue-header">
          <span>キューと履歴<span id="i2v-sel-count" class="sel-count"></span></span>
          <button class="sel-toggle-btn" id="i2v-toggle-btn" onclick="toggleSelectionMode()">選択</button>
        </div>
        <div id="i2v-action-bar" class="sel-action-bar" hidden>
          <button class="sel-action-btn" id="i2v-all-btn" onclick="toggleSelectAll()">全選択 ☑</button>
          <button class="sel-action-btn" id="i2v-save-btn" onclick="saveSelected()" disabled>保存 📥</button>
          <button class="sel-action-btn sel-delete-btn" id="i2v-del-btn" onclick="handleDeleteSelected()" disabled>削除 ✘</button>
        </div>
        <div id="i2v-queue-list" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
    </div>
  </div>

  <!-- ===== Loading View ===== -->
  <div id="view-loading" hidden>
    <div class="spinner"></div>
    <div class="loading-text">V API に送信中...</div>
  </div>

  <!-- ===== Result View (image) ===== -->
  <div id="view-result" hidden>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card">
        <img id="result-img" src="" alt="result">
      </div>
      <div class="result-prompt-box" id="img-prompt-box" hidden>
        <span class="result-prompt-text" id="img-prompt-text"></span>
        <button class="result-prompt-copy" onclick="copyPrompt(this)">コピー</button>
      </div>
      <button class="btn btn-primary" onclick="saveResult()">ダウンロード</button>
      <div class="btn-row" id="btn-row-edit-history" hidden>
        <button class="btn btn-secondary" onclick="editFromHistoryAs('i2i')">この画像から編集</button>
        <button class="btn btn-secondary" onclick="editFromHistoryAs('i2v')">この画像から動画に</button>
      </div>
      <button class="btn btn-secondary" id="btn-back-history" onclick="goBackFromHistory()" hidden>戻る</button>
      <button class="btn btn-secondary" id="btn-back-t2i" onclick="goBackT2I()" hidden>生成画面に戻る</button>
      <div class="btn-row" id="btn-row-i2i">
        <button class="btn btn-secondary" onclick="goNewImage()">別の画像を編集</button>
        <button class="btn btn-secondary" onclick="goSameImage()">同じ元画像を編集</button>
      </div>
    </div>
  </div>

  <!-- ===== Result View (video) ===== -->
  <div id="view-result-video" hidden>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card" style="padding:0;overflow:hidden;">
        <video id="result-video" controls style="width:100%;display:block;border-radius:var(--radius);"></video>
      </div>
      <div class="result-prompt-box" id="vid-prompt-box" hidden>
        <span class="result-prompt-text" id="vid-prompt-text"></span>
        <button class="result-prompt-copy" onclick="copyPrompt(this)">コピー</button>
      </div>
      <button class="btn btn-primary" onclick="downloadVideo()">ダウンロード</button>
      <button class="btn btn-secondary" onclick="goBackFromVideo()">生成画面に戻る</button>
    </div>
  </div>

</div>

<script>
  // ---------- IndexedDB ----------
  const DB_NAME = 'vtools-history';
  let _db = null;

  function openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        e.target.result.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror = () => rej(req.error);
    });
  }

  function dbAdd(record) {
    return new Promise((res, rej) => {
      const tx = _db.transaction('items', 'readwrite');
      const req = tx.objectStore('items').add(record);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  function dbGetAll() {
    return new Promise((res, rej) => {
      const tx = _db.transaction('items', 'readonly');
      const req = tx.objectStore('items').getAll();
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  function dbUpdate(id, changes) {
    return new Promise((res, rej) => {
      const tx = _db.transaction('items', 'readwrite');
      const store = tx.objectStore('items');
      const req = store.get(id);
      req.onsuccess = () => {
        const putReq = store.put(Object.assign({}, req.result, changes));
        putReq.onsuccess = () => res();
        putReq.onerror = () => rej(putReq.error);
      };
      req.onerror = () => rej(req.error);
    });
  }

  function dbDelete(id) {
    return new Promise((res, rej) => {
      const tx = _db.transaction('items', 'readwrite');
      const req = tx.objectStore('items').delete(id);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  }

  async function loadHistory() {
    try {
      await openDB();
      const records = await dbGetAll();
      records.sort((a, b) => b.timestamp - a.timestamp);
      for (const r of records) {
        const st = r.status || 'completed';
        if (r.type === 't2i' || r.type === 'i2i') {
          if (st === 'completed' && r.resultBlob) {
            imageQueue.push({
              status: 'completed',
              sourceThumbUrl: r.sourceThumbBlob ? URL.createObjectURL(r.sourceThumbBlob) : null,
              resultBlobUrl: URL.createObjectURL(r.resultBlob),
              filename: r.filename,
              dbId: r.id,
              prompt: r.prompt || '',
            });
          } else if (st === 'pending' || st === 'interrupted') {
            // 画像生成はサーバー側キューがなく再開不可 — 未完了レコードを削除
            dbDelete(r.id).catch(() => {});
          }
        } else if (r.type === 'i2v') {
          if (st === 'completed' && r.videoBlob) {
            i2vQueue.push({
              thumbUrl: URL.createObjectURL(r.thumbBlob),
              resolution: r.resolution,
              duration: r.duration,
              status: 'completed',
              downloadUrl: URL.createObjectURL(r.videoBlob),
              filename: r.filename,
              queueId: r.queueId || null,
              dbId: r.id,
              polling: false,
              prompt: r.prompt || '',
            });
          } else if (st === 'pending' && r.queueId) {
            i2vQueue.push({
              thumbUrl: URL.createObjectURL(r.thumbBlob),
              resolution: r.resolution,
              duration: r.duration,
              status: 'pending',
              downloadUrl: r.downloadUrl || null,
              filename: null,
              queueId: r.queueId,
              dbId: r.id,
              polling: false,
              prompt: r.prompt || '',
            });
          } else if (st === 'failed') {
            i2vQueue.push({
              thumbUrl: URL.createObjectURL(r.thumbBlob),
              resolution: r.resolution,
              duration: r.duration,
              status: 'failed',
              downloadUrl: null,
              filename: null,
              queueId: r.queueId || null,
              errorMsg: r.errorMsg || null,
              dbId: r.id,
              polling: false,
              prompt: r.prompt || '',
            });
          }
        }
      }
      renderGallery();
      renderI2VQueue();
    } catch (e) {
      console.error('loadHistory failed', e);
    }
  }

  function updateSelectionUI() {
    const isI2V = selectedMode === 'i2v';
    const prefix = isI2V ? 'i2v' : 'hist';
    const queue = isI2V ? i2vQueue : imageQueue;

    const selected = queue.filter(i => i.selected);
    const saveable = selected.filter(i => i.status === 'completed');
    const allSelected = queue.length > 0 && selected.length === queue.length;

    const countEl = document.getElementById(prefix + '-sel-count');
    if (countEl) countEl.textContent = selected.length > 0 ? '　' + selected.length + '件選択中' : '';

    const toggleBtn = document.getElementById(prefix + '-toggle-btn');
    if (toggleBtn) toggleBtn.textContent = selectionMode ? 'やめる' : '選択';

    const actionBar = document.getElementById(prefix + '-action-bar');
    if (actionBar) actionBar.hidden = !selectionMode;

    if (!selectionMode) return;

    const allBtn = document.getElementById(prefix + '-all-btn');
    if (allBtn) allBtn.textContent = allSelected ? '全解除 ☐' : '全選択 ☑';

    const saveBtn = document.getElementById(prefix + '-save-btn');
    if (saveBtn) saveBtn.disabled = saveable.length === 0;

    const delBtn = document.getElementById(prefix + '-del-btn');
    if (delBtn) {
      delBtn.disabled = selected.length === 0;
      if (selected.length === 0 && deleteConfirmPending) {
        deleteConfirmPending = false;
        delBtn.textContent = '削除 ✘';
        delBtn.classList.remove('confirm');
      }
    }

  async function saveSelected() {
    const isI2V = selectedMode === 'i2v';
    const queue = isI2V ? i2vQueue : imageQueue;
    const items = queue.filter(i => i.selected && i.status === 'completed');
    if (items.length === 0) return;

    if (items.length === 1) {
      const item = items[0];
      const url = isI2V ? item.downloadUrl : item.resultBlobUrl;
      const a = document.createElement('a');
      a.href = url; a.download = item.filename; a.click();
      return;
    }

    const zip = new JSZip();
    for (const item of items) {
      const url = isI2V ? item.downloadUrl : item.resultBlobUrl;
      const blob = await fetch(url).then(r => r.blob());
      zip.file(item.filename, blob);
    }
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const dateStr = String(d.getFullYear()) + pad(d.getMonth()+1) + pad(d.getDate());
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = 'V_' + dateStr + '.zip'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function handleDeleteSelected() {
    const queue = selectedMode === 'i2v' ? i2vQueue : imageQueue;
    if (queue.filter(i => i.selected).length === 0) return;
    const prefix = selectedMode === 'i2v' ? 'i2v' : 'hist';
    const delBtn = document.getElementById(prefix + '-del-btn');
    if (!deleteConfirmPending) {
      deleteConfirmPending = true;
      delBtn.textContent = 'OK? ✘';
      delBtn.classList.add('confirm');
      deleteConfirmTimer = setTimeout(() => {
        deleteConfirmPending = false;
        deleteConfirmTimer = null;
        delBtn.textContent = '削除 ✘';
        delBtn.classList.remove('confirm');
      }, 3000);
    } else {
      clearTimeout(deleteConfirmTimer);
      deleteConfirmTimer = null;
      deleteConfirmPending = false;
      const isI2V = selectedMode === 'i2v';
      const q = isI2V ? i2vQueue : imageQueue;
      const toDelete = q.filter(i => i.selected);
      for (const item of toDelete) {
        if (item.polling !== undefined) item.polling = false;
        if (item.resultBlobUrl) URL.revokeObjectURL(item.resultBlobUrl);
        if (item.sourceThumbUrl) URL.revokeObjectURL(item.sourceThumbUrl);
        if (item.thumbUrl) URL.revokeObjectURL(item.thumbUrl);
        if (item.downloadUrl && item.downloadUrl.startsWith('blob:')) URL.revokeObjectURL(item.downloadUrl);
        if (_db && item.dbId) dbDelete(item.dbId).catch(() => {});
        const idx = q.indexOf(item);
        if (idx !== -1) q.splice(idx, 1);
      }
      exitSelectionMode();
    }
  }

  async function makeThumbUrl(file) {
    const size = 60;
    const bitmap = await createImageBitmap(file);
    const { width: w, height: h } = bitmap;
    const side = Math.min(w, h);
    const sx = (w - side) / 2, sy = (h - side) / 2;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    canvas.getContext('2d').drawImage(bitmap, sx, sy, side, side, 0, 0, size, size);
    return new Promise(r => canvas.toBlob(b => r(URL.createObjectURL(b)), 'image/jpeg', 0.8));
  }

  function renderI2VQueue() {

    list.innerHTML = '';

      const row = document.createElement('div');

        row.style.cursor = 'pointer';

      thumb.src = item.thumbUrl;

      const info = document.createElement('div');
      info.className = 'i2v-info';
      info.textContent = `${item.resolution} / ${item.duration}`;

      let statusEl;
      if (item.status === 'completed') {
        if (selectionMode) {
          statusEl = document.createElement('span');
          statusEl.className = 'i2v-status-done';
          statusEl.style.pointerEvents = 'none';
          statusEl.textContent = '完了';

        statusEl = document.createElement('span');
        statusEl.className = 'i2v-status-failed';
        statusEl.textContent = item.errorMsg ? 'エラー: ' + item.errorMsg : 'エラー';
      } else if (!item.polling) {
        if (selectionMode) {
          statusEl = document.createElement('span');
          statusEl.className = 'i2v-status-pending';
          statusEl.textContent = '中断';
        } else {
          statusEl = document.createElement('div');

          const msg = document.createElement('span');
          msg.style.cssText = 'font-size:0.75rem;color:var(--muted);';

          btn.className = 'i2v-status-done';

          btn.addEventListener('click', () => resumeI2VPoll(item));

      } else if (item._downloading) {
        statusEl = document.createElement('span');
        statusEl.className = 'i2v-status-pending';

      } else if (!item.queueId) {
        statusEl = document.createElement('span');
        statusEl.className = 'i2v-status-pending';
        statusEl.textContent = '送信中...';
      } else {
        statusEl = document.createElement('span');
        statusEl.className = 'i2v-status-pending';
        statusEl.textContent = '生成待ち...';

      row.appendChild(thumb);
      row.appendChild(info);

  async function startI2V(apiKey, prompt) {
    const thumbUrl = await makeThumbUrl(S.rawFile);
    const duration = document.getElementById('i2v-duration').value;
    const item = {
      thumbUrl,
      resolution: selectedI2VResolution,
      duration,
      modelId: I2V_MODEL_IDS[selectedI2VModel],
      status: 'pending',
      downloadUrl: null,
      queueId: null,
      polling: true,
      prompt,
    };
    i2vQueue.unshift(item);
    renderI2VQueue();

    try {
      const { b64, mime } = await toResizedB64(S.rawFile, 2100);
      const res = await fetch('https://api.venice.ai/api/v1/video/queue', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + apiKey,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: I2V_MODEL_IDS[selectedI2VModel],
          prompt,
          image_url: 'data:' + mime + ';base64,' + b64,
          duration,
          resolution: item.resolution,
        }),
      });
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error(res.status + '|' + txt);
      }
      const data = await res.json();
      item.queueId = data.queue_id;
      if (data.download_url) item.downloadUrl = data.download_url;
      renderI2VQueue();
      // queue_id取得直後にDBへ保存
      if (_db) try {
        const thumbBlob = await fetch(item.thumbUrl).then(r => r.blob());
        item.dbId = await dbAdd({
          type: 'i2v', timestamp: Date.now(), status: 'pending',
          filename: null, thumbBlob, videoBlob: null,
          resolution: item.resolution, duration: item.duration,
          queueId: item.queueId, downloadUrl: item.downloadUrl || null,
          prompt: item.prompt || '',
        });
      } catch (_) {}
      scheduleI2VPoll(item, apiKey);
    } catch (e) {
      item.status = 'failed';
      item.polling = false;
      renderI2VQueue();
      showError(fmtError(e.message));
    }
  }

  function scheduleI2VPoll(item, apiKey, delay = 8000) {
    setTimeout(async () => {
      try {
        const res = await fetch('https://api.venice.ai/api/v1/video/retrieve', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ queue_id: item.queueId, model: item.modelId }),
        });
        const txt = await res.text();
        if (!res.ok) {
          if (res.status === 429) { scheduleI2VPoll(item, apiKey); return; }
          item.status = 'failed';
          item.polling = false;
          item.errorMsg = (res.status === 404 || res.status === 410)
            ? '期限切れ（キューが存在しません）'
            : res.status + ' ' + txt.slice(0, 80);
          if (_db && item.dbId) dbUpdate(item.dbId, { status: 'failed', errorMsg: item.errorMsg }).catch(() => {});
          renderI2VQueue();
          return;
        }
        const data = JSON.parse(txt);
        const st = (data.status || '').toUpperCase();
        if (st === 'COMPLETED') {
          if (data.download_url) item.downloadUrl = data.download_url;
          if (!item.downloadUrl) {
            item.status = 'failed';
            item.polling = false;
            item.errorMsg = '動画URLが取得できませんでした';
            if (_db && item.dbId) dbUpdate(item.dbId, { status: 'failed', errorMsg: item.errorMsg }).catch(() => {});
            renderI2VQueue();
            return;
          }
          item._downloading = true;
          renderI2VQueue();
          try {
            await saveI2VToDB(item);
            item._downloading = false;
            item.status = 'completed';
            item.polling = false;
            renderI2VQueue();
          } catch (e) {
            item._downloading = false;
            item.status = 'failed';
            item.polling = false;
            item.errorMsg = '動画のダウンロードに失敗しました';
            if (_db && item.dbId) dbUpdate(item.dbId, { status: 'failed', errorMsg: item.errorMsg }).catch(() => {});
            renderI2VQueue();
          }
        } else if (st === 'FAILED' || st === 'ERROR') {
          item.status = 'failed';
          item.polling = false;
          if (_db && item.dbId) dbUpdate(item.dbId, { status: 'failed' }).catch(() => {});
          renderI2VQueue();
        } else {
          item.pollStatus = st;
          renderI2VQueue();
          scheduleI2VPoll(item, apiKey);
        }
      } catch (e) {
        scheduleI2VPoll(item, apiKey);
      }
    }, 8000);
  }

  function openVideoResult(item) {
    document.getElementById('result-video').src = item.downloadUrl;
    S.resultFilename = item.filename || datetimeFilename('.mp4');
    const p = item.prompt || '';
    document.getElementById('vid-prompt-text').textContent = p;
    document.getElementById('vid-prompt-box').hidden = !p;
    showView('view-result-video');
  }

  async function downloadVideo() {
    const src = document.getElementById('result-video').src;
    const res = await fetch(src);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = S.resultFilename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function goBackFromVideo() {
    const video = document.getElementById('result-video');
    video.pause();
    video.src = '';
    showView('view-input');
  }

  function resumeI2VPoll(item) {
    const apiKey = document.getElementById('api-key').value.trim();
    if (!apiKey) { showError('再開するにはAPIキーを入力してください'); return; }
    hideError();
    item.polling = true;
    renderI2VQueue();
    scheduleI2VPoll(item, apiKey, 0);
  }

  // ---------- File handling ----------
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });

  function clearImage() {
    S.rawFile = null; S.imagePreviewUrl = ''; S.imageFilename = '';
    document.getElementById('preview-area').hidden = true;
    document.getElementById('dropzone').hidden = false;
    fileInput.value = '';
  }

  async function processFile(file) {
    const ok = ['image/jpeg', 'image/png', 'image/webp'];
    if (!ok.includes(file.type)) { showError('JPG・PNG・WebP の画像を選択してください'); return; }
    S.rawFile = file;
    S.imageFilename = file.name;
    S.imagePreviewUrl = URL.createObjectURL(file);
    restoreImagePreview(S.imagePreviewUrl, file.name);
    hideError();
  }

  function restoreImagePreview(url, filename) {
    document.getElementById('preview-img').src = url;
    document.getElementById('preview-info').textContent = filename || '';
    document.getElementById('preview-area').hidden = false;
    document.getElementById('dropzone').hidden = true;
  }

  async function toResizedB64(file, limit) {
    const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const bitmap = await createImageBitmap(file);
    const W = bitmap.width, H = bitmap.height;
    if (W + H <= limit) {
      return { b64: await readAsB64(file), mime: file.type };
    }
    const scale = limit / (W + H);
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, mime, mime === 'image/jpeg' ? 0.9 : undefined));
    return { b64: await readAsB64(blob), mime };
  }

  function readAsB64(fileOrBlob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(fileOrBlob);
    });
  }

  // ---------- Send ----------
  let i2vConfirmTimer = null;
  let i2vConfirmPending = false;

  function handleSendClick() {
    if (selectedMode !== 'i2v') {
      handleSend();
      return;
    }
    if (i2vConfirmPending) {
      clearTimeout(i2vConfirmTimer);
      i2vConfirmTimer = null;
      i2vConfirmPending = false;
      resetSendButton();
      handleSend();
    } else {
      const apiKey = document.getElementById('api-key').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      if (!apiKey) { showError('APIキーを入力してください'); return; }
      if (!S.rawFile) { showError('画像を選択してください'); return; }
      if (!prompt) { showError('プロンプトを入力してください'); return; }
      hideError();
      i2vConfirmPending = true;
      const btn = document.getElementById('send-btn');
      btn.textContent = '確認：送信してOK？';
      btn.classList.add('btn-confirm');
      i2vConfirmTimer = setTimeout(() => {
        i2vConfirmPending = false;
        i2vConfirmTimer = null;
        resetSendButton();
      }, 3000);
    }
  }

  function lockSendButton() {
    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = '送信中...';
    btn.classList.remove('btn-confirm');
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '送信';
    }, 2000);
  }

  function resetSendButton() {
    const btn = document.getElementById('send-btn');
    btn.textContent = '送信';
    btn.classList.remove('btn-confirm');
    btn.disabled = false;
  }

  async function handleSend() {
    const apiKey = document.getElementById('api-key').value.trim();
    const prompt  = document.getElementById('prompt').value.trim();

    if (!apiKey) { showError('APIキーを入力してください'); return; }
    if (!prompt)  { showError('プロンプトを入力してください'); return; }
    if ((selectedMode === 'i2i' || selectedMode === 'i2v') && !S.rawFile) { showError('画像を選択してください'); return; }

    S.apiKey = apiKey;
    S.prompt = prompt;
    hideError();
    lockSendButton();

    if (selectedMode === 'i2v') {
      startI2V(apiKey, prompt);
      return;
    }

    sendImageRequest(apiKey, prompt);
  }

  async function sendImageRequest(apiKey, prompt) {
    const mode = selectedMode;
    const item = { status: 'pending', sourceThumbUrl: null, resultBlobUrl: null, filename: '', dbId: null, prompt };
    imageQueue.unshift(item);
    renderGallery();

    // 送信直後にpendingレコードをDBへ保存
    if (_db) try {
      item.dbId = await dbAdd({ type: mode, timestamp: Date.now(), status: 'pending', filename: '', resultBlob: null, sourceThumbBlob: null, prompt });
    } catch (_) {}

    if (mode === 'i2i' && S.rawFile) {
      makeThumbUrl(S.rawFile).then(url => { item.sourceThumbUrl = url; renderGallery(); });
    }

    try {
      let blob;
      if (mode === 't2i') {
        blob = await callVeniceT2I(apiKey, prompt);
        const _ext = blob.type === 'image/png' ? '.png' : blob.type === 'image/webp' ? '.webp' : '.jpg';
        item.filename = datetimeFilename(_ext);
      } else {
        const limit = selectedResolution === '1K' ? 2100 : 4200;
        const { b64, mime } = await toResizedB64(S.rawFile, limit);
        blob = await callVeniceI2I(apiKey, b64, mime, prompt);
        const _ext = blob.type === 'image/png' ? '.png' : blob.type === 'image/webp' ? '.webp' : '.jpg';
        const _stem = S.imageFilename ? S.imageFilename.replace(/\.[^.]+$/, '') : 'image';
        const _d = new Date(), _p = n => String(n).padStart(2, '0');
        const _time = _p(_d.getHours()) + _p(_d.getMinutes()) + _p(_d.getSeconds());
        item.filename = _stem + _time + _ext;
      }
      item.resultBlobUrl = URL.createObjectURL(blob);
      item.status = 'completed';
      renderGallery();
      // 完了時にDBレコードを更新
      if (_db && item.dbId) try {
        const sourceThumbBlob = item.sourceThumbUrl ? await fetch(item.sourceThumbUrl).then(r => r.blob()) : null;
        await dbUpdate(item.dbId, { status: 'completed', filename: item.filename, resultBlob: blob, sourceThumbBlob });
      } catch (_) {}
    } catch (e) {
      // APIエラー時はDBレコードを削除してキューからも除去
      if (_db && item.dbId) dbDelete(item.dbId).catch(() => {});
      imageQueue.splice(imageQueue.indexOf(item), 1);
      renderGallery();
      showError(fmtError(e.message));
    }
  }

  async function callVeniceT2I(apiKey, prompt) {
    const res = await fetch('https://api.venice.ai/api/v1/image/generate', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: selectedModel,
        prompt: prompt,
        resolution: selectedResolution,
        aspect_ratio: document.getElementById('aspect-select').value,
        safe_mode: false,
        return_binary: true,
      }),
    });
    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(res.status + '|' + txt);
    }
    return await res.blob();
  }

  async function callVeniceI2I(apiKey, imageB64, mime, prompt) {
    const res = await fetch('https://api.venice.ai/api/v1/image/edit', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: selectedModel,
        prompt: prompt,
        image: 'data:' + mime + ';base64,' + imageB64,
        resolution: selectedResolution,
        safe_mode: false,
      }),
    });
    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(res.status + '|' + txt);
    }
    return await res.blob();
  }

  function fmtError(msg) {
    if (msg.startsWith('401|'))  return 'APIキーが無効です。キーを確認してください。';
    if (msg.startsWith('429|'))  return 'レート制限中です。少し待ってから再試行してください。';
    if (msg.startsWith('400|') || msg.startsWith('451|'))
      return 'リクエストが拒否されました（モデレーション）。プロンプトや画像を変えてみてください。';
    if (msg.startsWith('5'))     return 'V側でエラーが発生しました。しばらく後に再試行してください。';
    if (/fetch|NetworkError|CORS/i.test(msg))
      return 'ネットワークエラー。V APIがブラウザからのアクセスをブロックしている可能性があります（CORS）。';
    return 'エラー: ' + msg;
  }

  // ---------- Result actions ----------
  async function saveResult() {
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
    if (isTouchDevice && navigator.canShare) {
      try {
        const res = await fetch(S.resultBlobUrl);
        const blob = await res.blob();
        const file = new File([blob], S.resultFilename, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = S.resultBlobUrl;
    a.download = S.resultFilename;
    a.click();
  }

  function goBackT2I() {
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  function goNewImage() {
    clearImage();
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  function goSameImage() {
    restoreImagePreview(S.imagePreviewUrl, S.imageFilename);
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  function clearPrompt() {
    document.getElementById('prompt').value = '';
    promptByMode[selectedMode] = '';
  }

  function datetimeFilename(ext) {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const s = String(d.getFullYear()) + pad(d.getMonth()+1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes());
    return s + ext;
  }

  // ---------- Helpers ----------
  function showError(msg) {
    const b = document.getElementById('error-box');
    b.textContent = msg;
    b.hidden = false;
  }
  function hideError() {
    document.getElementById('error-box').hidden = true;
  }

  loadHistory();
</script>
