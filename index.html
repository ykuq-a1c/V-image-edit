<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V image editor</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPGJSV7MNR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZPGJSV7MNR');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #17171a;
      --surface2: #1f1f24;
      --border: #2e2e36;
      --accent: #7c3aed;
      --accent-h: #6d28d9;
      --text: #ececec;
      --muted: #777;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.1);
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding-bottom: 8px;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .quality-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .quality-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .quality-btn {
      padding: 5px 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .quality-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .credit-info {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input[type="password"],
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 13px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input[type="password"]:focus,
    textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 96px;
      line-height: 1.5;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .dropzone:hover,
    .dropzone.over {
      border-color: var(--accent);
      background: rgba(124,58,237,0.06);
    }
    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .dropzone-icon { font-size: 2rem; margin-bottom: 10px; }
    .dropzone-main { font-size: 0.9rem; }
    .dropzone-sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    /* Image preview */
    .preview-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      line-height: 0;
    }
    .preview-wrap img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }
    .preview-clear {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.65);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 0.9rem;
      line-height: 1;
      backdrop-filter: blur(4px);
    }
    .preview-info {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 4px 2px 0;
      line-height: 1;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
      text-align: center;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-row .btn { flex: 1; }

    /* Error */
    .error {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 9px;
      padding: 11px 14px;
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    /* Loading */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 18px;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 0.9rem; }

    /* Result image */
    #result-img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

[hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>V image editor</h1>
    <p>grok-imagine-edit via V API</p>
  </header>

  <!-- ===== Input View ===== -->
  <div id="view-input">
    <div style="display:flex;flex-direction:column;gap:14px;">

      <!-- API Key -->
      <div class="card">
        <div class="label">V API Key</div>
        <input type="password" id="api-key" placeholder="xxxxxxxx..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Image Upload -->
      <div class="card">
        <div class="label">元画像</div>

        <div id="dropzone" class="dropzone">
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
          <div class="dropzone-icon">🖼️</div>
          <div class="dropzone-main">画像をドロップ、またはタップして選択</div>
          <div class="dropzone-sub">JPG / PNG / WebP（大きい画像は自動リサイズ）</div>
        </div>

        <div id="preview-area" hidden>
          <div class="preview-wrap">
            <img id="preview-img" src="" alt="preview">
            <button class="preview-clear" onclick="clearImage()" title="削除">✕</button>
          </div>
          <div class="preview-info" id="preview-info"></div>
        </div>
      </div>

      <!-- Prompt -->
      <div class="card">
        <div class="label">プロンプト</div>
        <textarea id="prompt" placeholder="例: Make the background a snowy mountain landscape"></textarea>
      </div>

      <!-- Model + Quality -->
      <div class="quality-row">
        <div class="quality-toggle">
          <button type="button" class="quality-btn active" id="m-grok" onclick="setModel('grok-imagine-edit')">Grok</button>
          <button type="button" class="quality-btn" id="m-hq" onclick="setModel('grok-imagine-quality-edit')">GHQ</button>
        </div>
        <div class="quality-toggle">
          <button type="button" class="quality-btn active" id="q-1k" onclick="setQuality('1K')">1K</button>
          <button type="button" class="quality-btn" id="q-2k" onclick="setQuality('2K')">2K</button>
        </div>
        <div id="credit-info" class="credit-info">1枚 = 4クレジット消費</div>
      </div>

      <!-- Error -->
      <div id="error-box" class="error" hidden></div>

      <!-- Send -->
      <button class="btn btn-primary" id="send-btn" onclick="handleSend()">編集を送信</button>
    </div>
  </div>

  <!-- ===== Loading View ===== -->
  <div id="view-loading" hidden>
    <div class="spinner"></div>
    <div class="loading-text">V API に送信中...</div>
  </div>

  <!-- ===== Result View ===== -->
  <div id="view-result" hidden>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card">
        <img id="result-img" src="" alt="result">
      </div>
      <button class="btn btn-primary" onclick="saveResult()">ダウンロード</button>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goNewImage()">別の画像を編集</button>
        <button class="btn btn-secondary" onclick="goSameImage()">同じ元画像を編集</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ---------- Model + Quality selection ----------
  let selectedModel = 'grok-imagine-edit';
  let selectedResolution = '1K';
  function updateCreditInfo() {
    let text;
    if (selectedModel === 'grok-imagine-edit') {
      text = selectedResolution === '1K' ? '1枚 = 4クレジット消費' : '1枚 = 6クレジット消費';
    } else {
      text = selectedResolution === '1K' ? '1枚 = 10クレジット消費' : '1枚 = 12クレジット消費';
    }
    document.getElementById('credit-info').textContent = text;
  }

  function setModel(m) {
    selectedModel = m;
    document.getElementById('m-grok').classList.toggle('active', m === 'grok-imagine-edit');
    document.getElementById('m-hq').classList.toggle('active', m === 'grok-imagine-quality-edit');
    updateCreditInfo();
  }

  function setQuality(q) {
    selectedResolution = q;
    document.getElementById('q-1k').classList.toggle('active', q === '1K');
    document.getElementById('q-2k').classList.toggle('active', q === '2K');
    updateCreditInfo();
  }

  // ---------- In-memory state ----------
  const S = {
    apiKey: '',
    rawFile: null,
    imagePreviewUrl: '',
    imageFilename: '',
    prompt: '',
    resultBlobUrl: '',
    resultFilename: 'Vedit.jpg',
  };

  // ---------- View ----------
  function showView(id) {
    ['view-input', 'view-loading', 'view-result'].forEach(v => {
      document.getElementById(v).hidden = (v !== id);
    });
  }

  // ---------- File handling ----------
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });

  function clearImage() {
    S.rawFile = null; S.imagePreviewUrl = ''; S.imageFilename = '';
    document.getElementById('preview-area').hidden = true;
    document.getElementById('dropzone').hidden = false;
    fileInput.value = '';
  }

  async function processFile(file) {
    const ok = ['image/jpeg', 'image/png', 'image/webp'];
    if (!ok.includes(file.type)) { showError('JPG・PNG・WebP の画像を選択してください'); return; }
    S.rawFile = file;
    S.imageFilename = file.name;
    S.imagePreviewUrl = URL.createObjectURL(file);
    restoreImagePreview(S.imagePreviewUrl, file.name);
    hideError();
  }

  function restoreImagePreview(url, filename) {
    document.getElementById('preview-img').src = url;
    document.getElementById('preview-info').textContent = filename || '';
    document.getElementById('preview-area').hidden = false;
    document.getElementById('dropzone').hidden = true;
  }

  async function toResizedB64(file, limit) {
    const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const bitmap = await createImageBitmap(file);
    const W = bitmap.width, H = bitmap.height;
    if (W + H <= limit) {
      return { b64: await readAsB64(file), mime: file.type };
    }
    const scale = limit / (W + H);
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, mime, mime === 'image/jpeg' ? 0.9 : undefined));
    return { b64: await readAsB64(blob), mime };
  }

  function readAsB64(fileOrBlob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(fileOrBlob);
    });
  }

  // ---------- Send ----------
  async function handleSend() {
    const apiKey = document.getElementById('api-key').value.trim();
    const prompt  = document.getElementById('prompt').value.trim();

    if (!apiKey)        { showError('APIキーを入力してください'); return; }
    if (!S.rawFile)     { showError('画像を選択してください'); return; }
    if (!prompt)        { showError('プロンプトを入力してください'); return; }

    S.apiKey = apiKey;
    S.prompt = prompt;
    hideError();
    showView('view-loading');

    try {
      const limit = selectedResolution === '1K' ? 2100 : 4200;
      const { b64, mime } = await toResizedB64(S.rawFile, limit);
      const blob = await callVenice(apiKey, b64, mime, prompt);
      if (S.resultBlobUrl) URL.revokeObjectURL(S.resultBlobUrl);
      S.resultBlobUrl = URL.createObjectURL(blob);
      const _ext = blob.type === 'image/png' ? '.png' : blob.type === 'image/webp' ? '.webp' : '.jpg';
      const _stem = S.imageFilename ? S.imageFilename.replace(/\.[^.]+$/, '') : 'image';
      S.resultFilename = _stem + 'Vedit' + _ext;
      document.getElementById('result-img').src = S.resultBlobUrl;
      showView('view-result');
    } catch (e) {
      showView('view-input');
      showError(fmtError(e.message));
    }
  }

  async function callVenice(apiKey, imageB64, mime, prompt) {
    const res = await fetch('https://api.venice.ai/api/v1/image/edit', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: selectedModel,
        prompt: prompt,
        image: 'data:' + mime + ';base64,' + imageB64,
        resolution: selectedResolution,
        safe_mode: false,
      }),
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(res.status + '|' + txt);
    }
    return await res.blob();
  }

  function fmtError(msg) {
    if (msg.startsWith('401|'))  return 'APIキーが無効です。キーを確認してください。';
    if (msg.startsWith('429|'))  return 'レート制限中です。少し待ってから再試行してください。';
    if (msg.startsWith('400|') || msg.startsWith('451|'))
      return 'リクエストが拒否されました（モデレーション）。プロンプトや画像を変えてみてください。';
    if (msg.startsWith('5'))     return 'V側でエラーが発生しました。しばらく後に再試行してください。';
    if (/fetch|NetworkError|CORS/i.test(msg))
      return 'ネットワークエラー。V APIがブラウザからのアクセスをブロックしている可能性があります（CORS）。';
    return 'エラー: ' + msg;
  }

  // ---------- Result actions ----------
  async function saveResult() {
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
    if (isTouchDevice && navigator.canShare) {
      try {
        const res = await fetch(S.resultBlobUrl);
        const blob = await res.blob();
        const file = new File([blob], S.resultFilename, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return;
        }
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }
    const a = document.createElement('a');
    a.href = S.resultBlobUrl;
    a.download = S.resultFilename;
    a.click();
  }

  function goNewImage() {
    clearImage();
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  function goSameImage() {
    restoreImagePreview(S.imagePreviewUrl, S.imageFilename);
    document.getElementById('prompt').value = S.prompt;
    showView('view-input');
  }

  // ---------- Helpers ----------
  function showError(msg) {
    const b = document.getElementById('error-box');
    b.textContent = msg;
    b.hidden = false;
  }
  function hideError() {
    document.getElementById('error-box').hidden = true;
  }
</script>
</body>
</html>
